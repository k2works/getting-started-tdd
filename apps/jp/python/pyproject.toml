[project]
name = "fizzbuzz-jp"
version = "0.1.0"
description = "日本語識別子による FizzBuzz（Python）"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# 既定では parametrize の id の非 ASCII 文字が \uXXXX にエスケープされるため無効化する
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
