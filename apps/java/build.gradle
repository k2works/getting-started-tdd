plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.0.7'
}

import org.gradle.api.GradleException

group = 'tdd.fizzbuzz'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.12.0'
}

test {
    useJUnitPlatform()

    testLogging {
        events("passed", "skipped", "failed")
    }
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

pmd {
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
}

tasks.register('tdd', Test) {
    description = 'Runs the unit tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }

    testLogging {
        events('passed', 'skipped', 'failed')
        exceptionFormat 'full'
    }
}

tasks.register('qualityCheck') {
    description = 'Run all quality checks'
    group = 'verification'
    dependsOn 'checkstyleMain', 'checkstyleTest', 'pmdMain', 'pmdTest', 'spotbugsMain', 'spotbugsTest'
}

tasks.register('fullCheck') {
    description = 'Run all tests and quality checks'
    group = 'verification'
    dependsOn 'test', 'qualityCheck', 'jacocoTestReport'
}

def debugPort = 5005
def debugAgentArg = "jdwp=transport=dt_socket,server=y,suspend=y,address=${debugPort}"

tasks.register('cleanupDebugTest') {
    description = "Stops stale Java debug workers that still hold port ${debugPort}."
    group = 'verification'

    doLast {
        def currentPid = ProcessHandle.current().pid()
        def staleProcesses = ProcessHandle.allProcesses()
            .filter { handle ->
                handle.pid() != currentPid &&
                    handle.info().commandLine().orElse('').contains(debugAgentArg)
            }
            .toList()

        if (staleProcesses.isEmpty()) {
            println "No stale debug process found on port ${debugPort}."
            return
        }

        staleProcesses.each { handle ->
            def commandLine = handle.info().commandLine().orElse("pid=${handle.pid()}")
            println "Stopping stale debug process ${handle.pid()}: ${commandLine}"
            handle.destroy()
        }

        staleProcesses.each { handle ->
            def attempts = 0
            while (handle.isAlive() && attempts < 20) {
                sleep(100)
                attempts++
            }

            if (handle.isAlive()) {
                println "Force killing stale debug process ${handle.pid()}."
                handle.destroyForcibly()
            }

            attempts = 0
            while (handle.isAlive() && attempts < 20) {
                sleep(100)
                attempts++
            }

            if (handle.isAlive()) {
                throw new GradleException("Failed to stop stale debug process ${handle.pid()} on port ${debugPort}.")
            }
        }
    }
}

tasks.register('debugTest', Test) {
    description = 'Runs the test suite suspended for debugger attach.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named('cleanupDebugTest')
    outputs.upToDateWhen { false }

    debugOptions {
        enabled = true
        port = debugPort
        server = true
        suspend = true
    }

    testLogging {
        events("passed", "skipped", "failed")
    }
}
