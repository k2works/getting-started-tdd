AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Metrics/MethodLength:
  Max: 20

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'Rakefile'

Naming/MethodName:
  Enabled: false

Naming/AsciiIdentifiers:
  Exclude:
    - 'test/**/*'
