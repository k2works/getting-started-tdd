name: Kotlin CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/kotlin/**"
      - ".github/workflows/kotlin-ci.yml"
      - "ops/nix/environments/kotlin/shell.nix"
  pull_request:
    branches: [main]
    paths:
      - "apps/kotlin/**"
      - ".github/workflows/kotlin-ci.yml"
      - "ops/nix/environments/kotlin/shell.nix"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /tmp/nix-cache
          key: ${{ runner.os }}-nix-kotlin-${{ hashFiles('flake.lock', 'ops/nix/environments/kotlin/shell.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-kotlin-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/kotlin/build.gradle.kts', 'apps/kotlin/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: nix develop .#kotlin --command bash -c "cd apps/kotlin && gradle build --console=plain"

      - name: Test
        run: nix develop .#kotlin --command bash -c "cd apps/kotlin && gradle test --console=plain"
