name: Elixir CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/elixir/**"
      - ".github/workflows/elixir-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/elixir/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /tmp/nix-cache
          key: ${{ runner.os }}-nix-elixir-${{ hashFiles('flake.lock', 'ops/nix/environments/elixir/shell.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-elixir-

      - name: Install dependencies
        run: nix develop .#elixir --command bash -c "cd apps/elixir && mix deps.get"

      - name: Check formatting
        run: nix develop .#elixir --command bash -c "cd apps/elixir && mix format --check-formatted"

      - name: Run Credo
        run: nix develop .#elixir --command bash -c "cd apps/elixir && mix credo --strict"

      - name: Run complexity check
        run: nix develop .#elixir --command bash -c "cd apps/elixir && bash scripts/complexity.sh --threshold 10 lib"

      - name: Run tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir && mix test"
