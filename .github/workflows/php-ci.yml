name: PHP CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/php/**"
      - ".github/workflows/php-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/php/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /tmp/nix-cache
          key: ${{ runner.os }}-nix-php-${{ hashFiles('flake.lock', 'ops/nix/environments/php/shell.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-php-

      - name: Install dependencies
        run: nix develop .#php --command bash -c "cd apps/php && composer install --no-interaction --prefer-dist"

      - name: Run PHP_CodeSniffer
        run: nix develop .#php --command bash -c "cd apps/php && vendor/bin/phpcs"

      - name: Run PHPStan
        run: nix develop .#php --command bash -c "cd apps/php && vendor/bin/phpstan analyse"

      - name: Run tests
        run: nix develop .#php --command bash -c "cd apps/php && vendor/bin/phpunit"
