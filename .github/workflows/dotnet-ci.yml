name: .NET CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/csharp/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/csharp/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /tmp/nix-cache
          key: ${{ runner.os }}-nix-dotnet-${{ hashFiles('flake.lock', 'ops/nix/environments/dotnet/shell.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-dotnet-

      - name: Restore .NET tools
        run: nix develop .#dotnet --command bash -c "cd apps/csharp && dotnet tool restore"

      - name: Run Cake Check
        run: nix develop .#dotnet --command bash -c "cd apps/csharp && dotnet dotnet-cake --target=Check"
