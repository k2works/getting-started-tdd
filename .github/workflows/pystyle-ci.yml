name: Nadesiko Python Style CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/pystyle/**"
      - ".github/workflows/pystyle-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/pystyle/**"
      - ".github/workflows/pystyle-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [nadesiko, python]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /tmp/nix-cache
          key: ${{ runner.os }}-nix-${{ matrix.lang }}-${{ hashFiles('flake.lock', format('ops/nix/environments/{0}/shell.nix', matrix.lang)) }}
          restore-keys: |
            ${{ runner.os }}-nix-${{ matrix.lang }}-

      - name: Test
        env:
          LANG: C.UTF-8
        run: nix develop .#${{ matrix.lang }} --command bash -c "make -C apps/pystyle/${{ matrix.lang }} check"
