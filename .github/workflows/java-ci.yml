name: Java CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/java/**'
      - 'ops/nix/environments/java/**'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches: [main]
    paths:
      - 'apps/java/**'
      - 'ops/nix/environments/java/**'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /tmp/nix-cache
          key: ${{ runner.os }}-nix-java-${{ hashFiles('flake.lock', 'ops/nix/environments/java/shell.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-java-

      - name: Run full check
        run: nix develop .#java --command bash -c "cd apps/java && ./gradlew fullCheck"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/java/build/reports/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/java/build/jacocoHtml/
